name: Release build

on:
  push:
    tags:
      - 'v*.*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 1.0.0.0 or 1.0.0.0-preview01; optional v prefix)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/build/cache/nuget/
  VCPKG_ROOT: ${{ github.workspace }}/build/tools/vcpkg
  STONE_ANDROID_PLATFORM: 'android-37.0'
  STONE_ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  build:
    name: Package Windows x64 / ARM64
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      checksums: ${{ steps.assets.outputs.checksums }}
    env:
      STONE_PACKAGE_PUBLISHER: ${{ vars.STONE_PACKAGE_PUBLISHER || 'CN=Trebledot' }}
      STONE_PACKAGE_TIMESTAMP_URL: ${{ vars.STONE_PACKAGE_TIMESTAMP_URL }}
      STONE_SIGNING_TRUST_SELF_SIGNED: ${{ vars.STONE_SIGNING_TRUST_SELF_SIGNED || 'false' }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = if ($env:GITHUB_EVENT_NAME -eq 'push') {
              if ($env:GITHUB_REF_TYPE -ne 'tag') { throw 'A release build requires a tag.' }
              $env:GITHUB_REF_NAME
          } else { $env:INPUT_VERSION }
          $resolved = Join-Path $env:RUNNER_TEMP 'stone-version.json'
          cmake "-DSTONE_VERSION=$version" "-DSTONE_VERSION_OUTPUT=$resolved" -P cmake/StoneVersion.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Release version validation failed.' }
          $identity = Get-Content -LiteralPath $resolved -Raw | ConvertFrom-Json
          "version=$($identity.version)" >> $env:GITHUB_OUTPUT
          "prerelease=$($identity.prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "STONE_RELEASE_VERSION=$($identity.version)" >> $env:GITHUB_ENV
          "STONE_RELEASE_PACKAGE_VERSION=$($identity.packageVersion)" >> $env:GITHUB_ENV
          "Version: $($identity.version); installer version: $($identity.packageVersion)" >> $env:GITHUB_STEP_SUMMARY
          'STONE_PACKAGE_CERTIFICATE_THUMBPRINT=' >> $env:GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET SDK and WiX runtime
        id: dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: windows-2025-vs2026-${{ runner.arch }}-nuget-v1-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('src/windows/settings/CMakeLists.txt', 'src/windows/settings/Settings.targets', 'test/windows/**/*.csproj', '.github/workflows/build.yml', '.github/workflows/release.yml') }}
          restore-keys: |
            windows-2025-vs2026-${{ runner.arch }}-nuget-v1-${{ steps.dotnet.outputs.dotnet-version }}-

      - name: Locate Android SDK
        id: android-sdk
        run: |
          if (!$env:ANDROID_HOME) { throw 'The runner must provide ANDROID_HOME.' }
          "root=$env:ANDROID_HOME" >> $env:GITHUB_OUTPUT

      - name: Cache Android SDK packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.android-sdk.outputs.root }}/platforms/${{ env.STONE_ANDROID_PLATFORM }}
            ${{ steps.android-sdk.outputs.root }}/build-tools/${{ env.STONE_ANDROID_BUILD_TOOLS }}
          key: windows-2025-vs2026-${{ runner.arch }}-android-sdk-v1-${{ env.STONE_ANDROID_PLATFORM }}-${{ env.STONE_ANDROID_BUILD_TOOLS }}

      - name: Prepare Visual Studio from .vsconfig
        run: |
          $ErrorActionPreference = 'Stop'
          $configPath = (Resolve-Path -LiteralPath .vsconfig).Path
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $components = @($config.components)
          if ($config.version -ne '1.0' -or !$components.Count) { throw 'Invalid .vsconfig.' }
          $installerRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer'
          $vswhere = Join-Path $installerRoot 'vswhere.exe'
          $vs = & $vswhere -latest -version '[18.0,19.0)' -products '*' `
              -requires @components -property installationPath
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio discovery failed.' }
          if (!$vs) {
              $instancesJson = & $vswhere -latest -version '[18.0,19.0)' -products '*' -format json
              if ($LASTEXITCODE -ne 0) { throw 'Visual Studio discovery failed.' }
              $instances = @($instancesJson | Out-String | ConvertFrom-Json)
              if (!$instances.Count) { throw 'The runner must have Visual Studio 2026 installed.' }
              $instance = $instances[0]
              $arguments = @(
                  'modify', '--installPath', ('"{0}"' -f $instance.installationPath),
                  '--channelId', $instance.channelId, '--config', ('"{0}"' -f $configPath),
                  '--quiet', '--norestart'
              )
              $installer = Start-Process -FilePath (Join-Path $installerRoot 'setup.exe') `
                  -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
              if ($installer.ExitCode -eq 3010) { throw 'Visual Studio installation requires a runner restart.' }
              if ($installer.ExitCode -ne 0) { throw "Visual Studio Installer failed: $($installer.ExitCode)" }
              $vs = & $vswhere -latest -version '[18.0,19.0)' -products '*' `
                  -requires @components -property installationPath
              if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Visual Studio components required by .vsconfig are missing.' }
          }
          "STONE_VS_INSTALLATION=$vs" >> $env:GITHUB_ENV
          "VCPKG_VISUAL_STUDIO_PATH=$vs" >> $env:GITHUB_ENV

      - name: Prepare remaining build dependencies
        env:
          STONE_DOTNET_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cmakeHelp = cmake --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $cmakeHelp -notmatch 'Visual Studio 18 2026') {
              throw 'CMake must support the Visual Studio 18 2026 generator.'
          }
          # The image can contain newer SDKs; keep MSBuild on the selected .NET 10 SDK.
          @{ sdk = @{ version = $env:STONE_DOTNET_SDK; rollForward = 'latestPatch' } } |
              ConvertTo-Json | Set-Content -LiteralPath global.json -Encoding utf8
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkmanager --sdk_root=$env:ANDROID_HOME "platforms;$env:STONE_ANDROID_PLATFORM" "build-tools;$env:STONE_ANDROID_BUILD_TOOLS"
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed.' }
          foreach ($relative in @("platforms/$env:STONE_ANDROID_PLATFORM/android.jar", "build-tools/$env:STONE_ANDROID_BUILD_TOOLS/lib/d8.jar")) {
              if (!(Test-Path -LiteralPath (Join-Path $env:ANDROID_HOME $relative) -PathType Leaf)) {
                  throw "Missing Android SDK input: $relative"
              }
          }
          dotnet tool install wix --version 4.0.6 --tool-path build/tools/wix
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot report CMake version.' }
          dotnet --info
          if ($LASTEXITCODE -ne 0) { throw 'Cannot report .NET versions.' }

      - name: Import optional package signing certificate
        env:
          PFX_PASSWORD: ${{ secrets.STONE_SIGNING_CERTIFICATE_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.STONE_SIGNING_GPG_PASSPHRASE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $encryptedCertificate = Join-Path $env:GITHUB_WORKSPACE 'tools/packaging/signature.pfx.gpg'
          $useGpg = Test-Path -LiteralPath $encryptedCertificate
          if (!$useGpg) {
              if ($env:PFX_PASSWORD -or $env:GPG_PASSPHRASE) { throw 'Signing secrets were supplied without signature.pfx.gpg.' }
              Write-Host 'Building unsigned packages; MSIX deployment requires signing before installation.'
              return
          }
          if (!$env:PFX_PASSWORD) { throw 'Set STONE_SIGNING_CERTIFICATE_PASSWORD for the password-protected PFX.' }
          if (!$env:STONE_PACKAGE_TIMESTAMP_URL) { throw 'Signed releases require STONE_PACKAGE_TIMESTAMP_URL.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'stone-release-signing.pfx'
          try {
              if (!$env:GPG_PASSPHRASE) { throw 'Set STONE_SIGNING_GPG_PASSPHRASE for signature.pfx.gpg.' }
              . "$env:GITHUB_WORKSPACE/tools/packaging/CertificateGpg.ps1"
              $passphrase = ConvertTo-SecureString $env:GPG_PASSPHRASE -AsPlainText -Force
              Invoke-CertificateGpg -Mode Decrypt -InputFile $encryptedCertificate -OutputFile $pfx -Passphrase $passphrase
              $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
              $certificates = @(Import-PfxCertificate -FilePath $pfx -Password $password -CertStoreLocation Cert:\CurrentUser\My)
              "STONE_IMPORTED_CERTIFICATES=$($certificates.Thumbprint -join ';')" >> $env:GITHUB_ENV
              $signers = @($certificates | Where-Object HasPrivateKey)
              if ($signers.Count -ne 1) { throw 'The PFX must contain exactly one signing certificate with a private key.' }
              $certificate = $signers[0]
              if ($certificate.Subject -cne $env:STONE_PACKAGE_PUBLISHER) {
                  throw 'The signing certificate Subject must match STONE_PACKAGE_PUBLISHER.'
              }
              if ($certificate.NotBefore -gt (Get-Date) -or $certificate.NotAfter -le (Get-Date)) {
                  throw 'The signing certificate is outside its validity period.'
              }
              $publicCertificate = Join-Path $env:RUNNER_TEMP 'Stone.cer'
              Export-Certificate -Cert $certificate -FilePath $publicCertificate -Type CERT | Out-Null
              if ($certificate.Subject -ceq $certificate.Issuer) {
                  if ($env:STONE_SIGNING_TRUST_SELF_SIGNED -cne 'true') {
                      throw 'Self-signed CI signing requires STONE_SIGNING_TRUST_SELF_SIGNED=true.'
                  }
                  # SignTool /pa needs root trust. Scope this opt-in to this disposable
                  # hosted runner and remove it in cleanup. End users use TrustedPeople.
                  if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Self-signed trust requires a GitHub-hosted runner.' }
                  if (!(Test-Path "Cert:\LocalMachine\Root\$($certificate.Thumbprint)")) {
                      "STONE_IMPORTED_SIGNING_ROOT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
                      Import-Certificate -FilePath $publicCertificate -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
                  }
              }
              "STONE_PACKAGE_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          } finally {
              if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
          }

      - name: Read vcpkg baseline and default cache locations
        id: vcpkg
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -notmatch '^[0-9a-f]{40}$') { throw 'Invalid vcpkg baseline.' }
          "revision=$baseline" >> $env:GITHUB_OUTPUT
          "downloads=$env:VCPKG_ROOT/downloads" >> $env:GITHUB_OUTPUT
          "archives=$env:LOCALAPPDATA/vcpkg/archives" >> $env:GITHUB_OUTPUT

      - name: Provide external vcpkg checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg.outputs.revision }}
          path: build/tools/vcpkg
          persist-credentials: false

      - name: Cache vcpkg downloads and binary packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.vcpkg.outputs.downloads }}
            ${{ steps.vcpkg.outputs.archives }}
          key: windows-2025-vs2026-vcpkg-v3-${{ hashFiles('vcpkg.json', 'dep/vcpkg-overlay-ports/**', 'dep/vcpkg-overlay-triplets/**') }}

      - name: Build Release MSI and MSIX packages
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($architecture in @('x64', 'ARM64')) {
              cmake --preset $architecture -DSTONE_TESTS=OFF -DSTONE_PACKAGING=ON `
                  -DSTONE_BUILD_SETTINGS=ON -DSTONE_SETTINGS_AOT=ON -DSTONE_SETTINGS_TRIM=ON `
                  "-DCMAKE_GENERATOR_INSTANCE=$env:STONE_VS_INSTALLATION" `
                  "-DSTONE_JDK_HOME=$env:JAVA_HOME" "-DSTONE_ANDROID_SDK=$env:ANDROID_HOME" `
                  "-DSTONE_WIX_EXECUTABLE=$PWD/build/tools/wix/wix.exe" `
                  "-DSTONE_VERSION=$env:STONE_RELEASE_VERSION" `
                  "-DSTONE_PACKAGE_PUBLISHER=$env:STONE_PACKAGE_PUBLISHER" `
                  "-DSTONE_PACKAGE_CERTIFICATE_THUMBPRINT=$env:STONE_PACKAGE_CERTIFICATE_THUMBPRINT" `
                  "-DSTONE_PACKAGE_TIMESTAMP_URL=$env:STONE_PACKAGE_TIMESTAMP_URL" `
                  '-DSTONE_PACKAGE_BUNDLE_ARCHITECTURES=x64;ARM64'
              if ($LASTEXITCODE -ne 0) { throw "$architecture release configuration failed." }
              cmake --build "build/$architecture" --config Release --parallel --target msipackage msixinstallerpackage -- /restore
              if ($LASTEXITCODE -ne 0) { throw "$architecture release packaging failed." }
          }
          cmake --build build/x64 --config Release --target bundle -- /restore
          if ($LASTEXITCODE -ne 0) { throw 'MSIXBundle creation failed.' }

      - name: Collect release assets and verify checksums
        id: assets
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = 'build/release-assets'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $version = $env:STONE_RELEASE_PACKAGE_VERSION
          $checksums = [ordered]@{}
          $packages = @(
              "bin/x64/Release/packages/Stone_${version}_x64.msi",
              "bin/ARM64/Release/packages/Stone_${version}_arm64.msi",
              "bin/x64/Release/packages/Stone_${version}_arm64_x64.msixbundle"
          )
          foreach ($package in $packages) {
              $checksum = (Get-Content -LiteralPath "$package.sha256" -Raw).Trim()
              $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash
              $expected = "$hash  $([IO.Path]::GetFileName($package))"
              if ($checksum -cne $expected) { throw "Checksum mismatch: $package" }
              $assetName = if ([IO.Path]::GetExtension($package) -ceq '.msixbundle') {
                  "Stone_$($env:STONE_RELEASE_VERSION).msixbundle"
              } else {
                  [IO.Path]::GetFileName($package).Replace(
                      "Stone_${version}_", "Stone_$($env:STONE_RELEASE_VERSION)_")
              }
              Copy-Item -LiteralPath $package -Destination (Join-Path $destination $assetName)
              $checksums[$assetName] = $hash
          }
          if ($env:STONE_PACKAGE_CERTIFICATE_THUMBPRINT) {
              Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'Stone.cer') -Destination $destination
              $hash = (Get-FileHash -LiteralPath "$destination/Stone.cer" -Algorithm SHA256).Hash
              $checksums['Stone.cer'] = $hash
          }
          "checksums=$($checksums | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT

      - name: Remove imported signing certificates
        if: ${{ always() }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:STONE_IMPORTED_SIGNING_ROOT -and (Test-Path "Cert:\LocalMachine\Root\$env:STONE_IMPORTED_SIGNING_ROOT")) {
              Remove-Item "Cert:\LocalMachine\Root\$env:STONE_IMPORTED_SIGNING_ROOT" -Force
          }
          foreach ($thumbprint in ($env:STONE_IMPORTED_CERTIFICATES -split ';')) {
              if ($thumbprint -and (Test-Path "Cert:\CurrentUser\My\$thumbprint")) {
                  Remove-Item "Cert:\CurrentUser\My\$thumbprint" -DeleteKey -Force
              }
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'stone-release-signing.pfx'
          if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }

      - name: Upload release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Stone-${{ steps.version.outputs.version }}-windows
          path: build/release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Create release draft
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: Stone-${{ needs.build.outputs.version }}-windows
          path: release-assets

      - name: Verify assets and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
          RELEASE_CHECKSUMS: ${{ needs.build.outputs.checksums }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location release-assets
          $assets = @(Get-ChildItem -File | Where-Object Extension -In '.msi', '.msix', '.msixbundle')
          $expectedNames = @(
              "Stone_$($env:RELEASE_VERSION)_x64.msi",
              "Stone_$($env:RELEASE_VERSION)_arm64.msi",
              "Stone_$($env:RELEASE_VERSION).msixbundle"
          )
          if ($assets.Count -ne $expectedNames.Count -or
              @($expectedNames | Where-Object { $_ -cnotin $assets.Name }).Count) {
              throw 'Expected x64/ARM64 MSI packages and one architecture-neutral MSIXBundle filename.'
          }
          $checksums = $env:RELEASE_CHECKSUMS | ConvertFrom-Json -AsHashtable
          foreach ($asset in $assets) {
              $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash
              if ($checksums[$asset.Name] -cne $hash) { throw "Checksum mismatch: $($asset.Name)" }
          }
          $files = @($assets.Name)
          if (Test-Path -LiteralPath Stone.cer) {
              $hash = (Get-FileHash -LiteralPath Stone.cer -Algorithm SHA256).Hash
              if ($checksums['Stone.cer'] -cne $hash) {
                  throw 'Public certificate checksum mismatch.'
              }
              $files += 'Stone.cer'
          }
          $releaseOptions = @()
          if ($env:RELEASE_PRERELEASE -eq 'true') { $releaseOptions += '--prerelease' }
          gh release create $env:RELEASE_TAG @files --verify-tag --draft `
              --title "Stone $env:RELEASE_TAG" --generate-notes @releaseOptions
          if ($LASTEXITCODE -ne 0) { throw 'Release draft creation failed; existing releases are never overwritten.' }
